<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Catálogo Profissional | THOMAZ SPORTS</title>
    <meta name="description" content="Catálogo de alta performance Beach Tennis.">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        :root {
            --primary-gold: #D4AF37;
            --primary-gold-hover: #b8962d;
            --dark-black: #000000;
            --deep-gray: #111111;
            --bg-light: #F4F6F8;
            --bg-card: #FFFFFF;
            --text-main: #111111;
            --text-muted: #666666;
            --border-color: #E0E0E0;
            --shadow-premium: 0 10px 30px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-main); overflow-x: hidden; display: flex; flex-direction: column; }
        h1, h2, h3 { font-family: 'Montserrat', sans-serif; font-weight: 900; text-transform: uppercase; }

        /* --- HEADER --- */
        header {
            background: var(--dark-black);
            padding: 15px 0;
            border-bottom: 3px solid var(--primary-gold);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        nav { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto; padding: 0 20px; }
        .logo img { height: 60px; }
        .btn-back {
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 30px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            transition: var(--transition);
        }
        .btn-back:hover { background: var(--primary-gold); color: #000; }

        /* --- LAYOUT --- */
        .main-wrapper { display: grid; grid-template-columns: 320px 1fr; min-height: calc(100vh - 80px); }

        /* --- SIDEBAR --- */
        aside {
            background: var(--deep-gray);
            color: #fff;
            padding: 40px 25px;
            position: sticky;
            top: 80px;
            height: calc(100vh - 80px);
            overflow-y: auto;
        }
        .sidebar-section { margin-bottom: 35px; }
        .sidebar-title {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--primary-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            display: block;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 5px;
        }
        .filter-list { list-style: none; }
        .filter-item {
            padding: 10px 15px;
            margin-bottom: 5px;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.85rem;
            color: #bbb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .filter-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .filter-item.active { background: var(--primary-gold); color: #000; font-weight: 700; }
        .count-badge {
            font-size: 0.7rem;
            background: rgba(0,0,0,0.3);
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
        }

        /* --- CONTENT AREA --- */
        .content { padding: 0; }
        .catalog-hero {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1622279457486-62d797367792?q=80&w=1000');
            background-size: cover;
            background-position: center;
            padding: 60px 40px;
            text-align: center;
            color: #fff;
            border-bottom: 4px solid var(--primary-gold);
        }
        .catalog-hero h1 { font-size: 3rem; margin-bottom: 10px; }
        .catalog-hero h1 span { color: var(--primary-gold); }

        /* TOOLBAR (Busca e Ordem) */
        .catalog-toolbar {
            background: #fff;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
        }
        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-light);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            flex: 1;
            max-width: 500px;
        }
        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
            margin-left: 10px;
            font-size: 0.9rem;
        }
        .sort-select {
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: #fff;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
        }

        .products-section { padding: 40px; }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        /* PRODUCT CARD */
        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 25px;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-premium);
        }
        .product-card:hover { transform: translateY(-10px); border-color: var(--primary-gold); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .product-card img { width: 100%; height: 260px; object-fit: contain; margin-bottom: 20px; transition: var(--transition); }
        .product-card:hover img { transform: scale(1.05); }

        .product-brand {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--primary-gold);
            text-transform: uppercase;
            margin-bottom: 5px;
            display: block;
        }
        .product-name {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--text-main);
            min-height: 45px;
        }

        .product-specs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid #eee;
        }
        .spec-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-main); font-weight: 600; }
        .spec-item i { color: var(--primary-gold); width: 18px; }

        .product-price {
            font-size: 2rem;
            font-weight: 900;
            color: var(--dark-black);
            margin-bottom: 20px;
            text-align: center;
        }

        .btn-buy {
            background-color: var(--dark-black);
            color: var(--primary-gold);
            padding: 18px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: var(--transition);
            cursor: pointer;
            border: 2px solid var(--primary-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-buy:hover { background-color: var(--primary-gold); color: #000; transform: translateY(-3px); }

        .loading-state { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 400px; width: 100%; }
        .spinner { width: 50px; height: 50px; border: 5px solid var(--border-color); border-top: 5px solid var(--primary-gold); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 992px) {
            .main-wrapper { grid-template-columns: 1fr; }
            aside { display: none; }
            .catalog-toolbar { flex-direction: column; align-items: stretch; }
            .search-box { max-width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Início</a>
                <a href="index.html" class="logo"><img src="logo.jpg" alt="THOMAZ SPORTS"></a>
                <div style="width: 100px;"></div>
            </nav>
        </div>
    </header>

    <div class="main-wrapper">
        <aside>
            <div class="sidebar-section">
                <span class="sidebar-title">Categorias</span>
                <ul class="filter-list" id="cat-filters">
                    <li class="filter-item active" onclick="setFilter('categoria', 'Todos', this)">Todos</li>
                </ul>
            </div>

            <div class="sidebar-section">
                <span class="sidebar-title">Faixa de Preço</span>
                <ul class="filter-list">
                    <li class="filter-item" onclick="setFilter('preco', 'baixo', this)">Até R$ 500 <span class="count-badge" id="count-baixo">0</span></li>
                    <li class="filter-item" onclick="setFilter('preco', 'medio', this)">R$ 500 - 1000 <span class="count-badge" id="count-medio">0</span></li>
                    <li class="filter-item" onclick="setFilter('preco', 'alto', this)">Acima de R$ 1000 <span class="count-badge" id="count-alto">0</span></li>
                </ul>
            </div>

            <div class="sidebar-section">
                <span class="sidebar-title">Marcas</span>
                <ul class="filter-list" id="brand-filters"></ul>
            </div>

            <div class="sidebar-section">
                <span class="sidebar-title">Ano</span>
                <ul class="filter-list" id="year-filters"></ul>
            </div>

            <div class="sidebar-section">
                <span class="sidebar-title">Material</span>
                <ul class="filter-list" id="material-filters"></ul>
            </div>
        </aside>

        <div class="content">
            <section class="catalog-hero">
                <h1>Catálogo <span>Elite</span></h1>
                <p>Equipamentos de alta performance para atletas que buscam a perfeição.</p>
            </section>

            <div class="catalog-toolbar">
                <div class="search-box">
                    <i class="fas fa-search" style="color: #aaa;"></i>
                    <input type="text" id="searchInput" placeholder="Buscar produto ou marca..." oninput="applyFilters()">
                </div>
                <select class="sort-select" id="sortSelect" onchange="applyFilters()">
                    <option value="default">Ordenar por:</option>
                    <option value="low">Menor Preço</option>
                    <option value="high">Maior Preço</option>
                    <option value="name">Nome (A-Z)</option>
                </select>
            </div>

            <section class="products-section">
                <div id="products-container" class="products-grid">
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <p>Carregando elite...</p>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });

        const CONFIG = {
            API_KEY: 'AIzaSyA-7LZCbtIrA6Wg_acpTCKo9-6AGXUow0Q', 
            SHEET_ID: '1Q56_9fPQy9tkYmOuhCTfnuxC3Ofc93VckerFnA1PpGE', 
            RANGE: 'Página1!B:K', 
            WHATSAPP_NUMBER: '27998912042' 
        };

        let allProducts = [];
        let filters = { categoria: 'Todos', marca: 'Todos', preco: 'Todos', ano: 'Todos', material: 'Todos' };

        function formatImageUrl(url) {
            if (!url) return 'https://via.placeholder.com/300';
            if (url.includes('drive.google.com')) {
                const regex = /\/d\/([a-zA-Z0-9_-]+)|id=([a-zA-Z0-9_-]+)/;
                const match = url.match(regex);
                return match ? `https://lh3.googleusercontent.com/d/${match[1] || match[2]}` : url;
            }
            return url;
        }

        function parsePrice(priceStr) {
            if (!priceStr) return 0;
            return parseFloat(priceStr.toString().replace('R$', '').replace('.', '').replace(',', '.').trim());
        }

        async function fetchProducts() {
            try {
                const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEET_ID}/values/${CONFIG.RANGE}?key=${CONFIG.API_KEY}`);
                const data = await response.json();
                if (!data.values) throw new Error();

                const headers = data.values[0].map(h => h.toLowerCase().trim());
                allProducts = data.values.slice(1).map(row => {
                    let p = {};
                    headers.forEach((h, i) => p[h] = row[i]);
                    return p;
                });

                initDynamicFilters();
                applyFilters();
            } catch (e) {
                document.getElementById('products-container').innerHTML = '<div class="loading-state"><p>Erro ao carregar dados.</p></div>';
            }
        }

        function initDynamicFilters() {
            const setupFilter = (id, key) => {
                const container = document.getElementById(id);
                const values = [...new Set(allProducts.map(p => p[key]))].filter(Boolean).sort();
                
                const allLi = document.createElement('li');
                allLi.className = 'filter-item active';
                allLi.innerHTML = `Todos <span class="count-badge">${allProducts.length}</span>`;
                allLi.onclick = () => setFilter(key, 'Todos', allLi);
                container.appendChild(allLi);

                values.forEach(val => {
                    const count = allProducts.filter(p => p[key] === val).length;
                    const li = document.createElement('li');
                    li.className = 'filter-item';
                    li.innerHTML = `${val} <span class="count-badge">${count}</span>`;
                    li.onclick = () => setFilter(key, val, li);
                    container.appendChild(li);
                });
            };

            // Categorias Fixas
            const catContainer = document.getElementById('cat-filters');
            ['Raquete', 'Bola', 'Acessório'].forEach(cat => {
                const li = document.createElement('li');
                li.className = 'filter-item';
                const count = allProducts.filter(p => p.categoria === cat).length;
                li.innerHTML = `${cat} <span class="count-badge">${count}</span>`;
                li.onclick = () => setFilter('categoria', cat, li);
                catContainer.appendChild(li);
            });

            setupFilter('brand-filters', 'marca');
            setupFilter('year-filters', 'ano');
            setupFilter('material-filters', 'material');
            updatePriceCounts();
        }

        function updatePriceCounts() {
            const counts = { baixo: 0, medio: 0, alto: 0 };
            allProducts.forEach(p => {
                const pr = parsePrice(p.preco);
                if (pr > 0 && pr <= 500) counts.baixo++;
                else if (pr > 500 && pr <= 1000) counts.medio++;
                else if (pr > 1000) counts.alto++;
            });
            document.getElementById('count-baixo').textContent = counts.baixo;
            document.getElementById('count-medio').textContent = counts.medio;
            document.getElementById('count-alto').textContent = counts.alto;
        }

        function setFilter(key, value, element) {
            filters[key] = value;
            // UI Active state
            const parent = element.parentElement;
            parent.querySelectorAll('.filter-item').forEach(li => li.classList.remove('active'));
            element.classList.add('active');
            applyFilters();
        }

        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const sortBy = document.getElementById('sortSelect').value;

            let filtered = allProducts.filter(p => {
                const matchBrand = filters.marca === 'Todos' || p.marca === filters.marca;
                const matchCat = filters.categoria === 'Todos' || (p.categoria && p.categoria.toLowerCase().includes(filters.categoria.toLowerCase()));
                const matchYear = filters.ano === 'Todos' || p.ano === filters.ano;
                const matchMat = filters.material === 'Todos' || p.material === filters.material;
                
                let matchPrice = true;
                const pr = parsePrice(p.preco);
                if (filters.preco === 'baixo') matchPrice = pr > 0 && pr <= 500;
                else if (filters.preco === 'medio') matchPrice = pr > 500 && pr <= 1000;
                else if (filters.preco === 'alto') matchPrice = pr > 1000;

                const matchSearch = (p.nome || '').toLowerCase().includes(searchTerm) || (p.marca || '').toLowerCase().includes(searchTerm);

                return matchBrand && matchCat && matchYear && matchMat && matchPrice && matchSearch;
            });

            // Ordenação
            if (sortBy === 'low') filtered.sort((a, b) => parsePrice(a.preco) - parsePrice(b.preco));
            else if (sortBy === 'high') filtered.sort((a, b) => parsePrice(b.preco) - parsePrice(a.preco));
            else if (sortBy === 'name') filtered.sort((a, b) => (a.nome || '').localeCompare(b.nome || ''));

            renderProducts(filtered);
        }

        function renderProducts(products) {
            const container = document.getElementById('products-container');
            container.innerHTML = ''; 

            if (products.length === 0) {
                container.innerHTML = '<p style="text-align:center; width:100%; grid-column: 1/-1; padding: 50px;">Nenhum produto encontrado para esses filtros.</p>';
                return;
            }

            products.forEach((product, index) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.setAttribute('data-aos', 'fade-up');
                card.setAttribute('data-aos-delay', (index % 4) * 100);

                let specsHTML = '';
                if (product.peso) specsHTML += `<div class="spec-item"><i class="fas fa-weight-hanging"></i><span class="spec-value">${product.peso}</span></div>`;
                if (product.material) specsHTML += `<div class="spec-item"><i class="fas fa-gem"></i><span class="spec-value">${product.material}</span></div>`;
                if (product.balance) specsHTML += `<div class="spec-item"><i class="fas fa-crosshairs"></i><span class="spec-value">${product.balance}</span></div>`;

                card.innerHTML = `
                    <img src="${formatImageUrl(product.imagem || product.imagem_url)}" alt="${product.nome}" onerror="this.src='https://via.placeholder.com/300'">
                    <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between;">
                        <div>
                            <span class="product-brand">${product.marca || 'Premium'} ${product.ano ? ' | ' + product.ano : ''}</span>
                            <h3 class="product-name">${product.nome || 'Produto'}</h3>
                            ${specsHTML ? `<div class="product-specs">${specsHTML}</div>` : ''}
                        </div>
                        <div style="text-align: center;">
                            <p class="product-price">R$ ${product.preco || '0,00'}</p>
                            <button class="btn-buy" onclick="handleBuy('${product.nome}', '${product.marca}', '${product.preco}', '${product.peso}', '${product.material}', '${product.balance}', '${product.ano}')">
                                <i class="fab fa-whatsapp"></i> Comprar Agora
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function handleBuy(nome, marca, preco, peso, material, balance, ano) {
            const message = `Olá! Tenho interesse no produto ${nome} (${marca} ${ano || ''}).\n\n` +
                            `Especificações:\n${peso ? '- Peso: ' + peso + '\n' : ''}` +
                            `${material ? '- Material: ' + material + '\n' : ''}` +
                            `${balance ? '- Balance: ' + balance + '\n' : ''}` +
                            `Valor: R$ ${preco || '0,00'}.\n\nAinda tem em estoque?`;
            window.open(`https://wa.me/${CONFIG.WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`, '_blank');
        }

        document.addEventListener('DOMContentLoaded', fetchProducts);
    </script>
</body>
</html>
